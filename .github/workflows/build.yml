name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write project files
        run: |
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'EOF_HF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HideFollowers"
          include ':app'
          EOF_HF
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'EOF_HF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_HF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_HF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_HF
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'EOF_HF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.anna.hidefollowers'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.anna.hidefollowers'
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName '1.1'
              }

              signingConfigs {
                  debug {
                      storeFile file('hf.keystore')
                      storePassword 'hidefollowers'
                      keyAlias 'hf'
                      keyPassword 'hidefollowers'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_HF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_HF'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- Обрати внимание: разрешения INTERNET нет. Приложение физически не может ничего никуда отправить. -->
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".HideService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_HF
          mkdir -p "$(dirname 'app/src/main/res/xml/accessibility_config.xml')"
          cat > 'app/src/main/res/xml/accessibility_config.xml' <<'EOF_HF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled|typeWindowsChanged|typeViewClicked|typeViewSelected"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="0"
              android:description="@string/service_description" />
          EOF_HF
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'EOF_HF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Скрыть подписчиков</string>
              <string name="service_description">Закрывает плашкой число подписчиков на твоём собственном профиле в Instagram. Работает только внутри Instagram, ничего не сохраняет и не отправляет: у приложения нет доступа в интернет.</string>
          </resources>
          EOF_HF
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher.xml')"
          cat > 'app/src/main/res/drawable/ic_launcher.xml' <<'EOF_HF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#E1306C"
                  android:pathData="M24,2a22,22 0,1 0,0.01 0z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,15c-7,0 -12.5,5.2 -14,9c1.5,3.8 7,9 14,9s12.5,-5.2 14,-9c-1.5,-3.8 -7,-9 -14,-9zM24,29.5a5.5,5.5 0,1 1,0 -11a5.5,5.5 0,1 1,0 11z" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="3"
                  android:strokeLineCap="round"
                  android:pathData="M12,12L36,36" />
          </vector>
          EOF_HF
          mkdir -p "$(dirname 'app/src/main/java/com/anna/hidefollowers/HideService.java')"
          cat > 'app/src/main/java/com/anna/hidefollowers/HideService.java' <<'EOF_HF'
          package com.anna.hidefollowers;

          import android.accessibilityservice.AccessibilityService;
          import android.content.SharedPreferences;
          import android.content.res.Configuration;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;
          import java.util.regex.Pattern;

          /**
           * Закрывает плашкой число подписчиков на СОБСТВЕННОМ профиле в Instagram.
           * Чужие профили, лайки и всё остальное не трогает.
           */
          public class HideService extends AccessibilityService {

              private static final String IG = "com.instagram.android";

              // Подпись под числом подписчиков (рус / англ / исп).
              // «подписч» не совпадает с «Подписки», «follower» — с «following».
              private static final Pattern FOLLOWERS = Pattern.compile(
                      "подписч|follower|seguidor",
                      Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);

              // Кнопка, которая есть только на своём профиле — по ней понимаем, что профиль твой.
              private static final Pattern OWN_PROFILE = Pattern.compile(
                      "редактировать профиль|редактировать|edit profile|editar perfil",
                      Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);

              // Внутренние идентификаторы Instagram (могут меняться с обновлениями — поэтому есть ещё поиск по тексту).
              private static final Set<String> FOLLOWER_IDS = new HashSet<>(Arrays.asList(
                      IG + ":id/row_profile_header_followers_container",
                      IG + ":id/row_profile_header_textview_followers_count",
                      IG + ":id/row_profile_header_textview_followers_title",
                      IG + ":id/profile_header_followers_container"));
              private static final Set<String> OWN_IDS = new HashSet<>(Arrays.asList(
                      IG + ":id/profile_header_edit_profile_button",
                      IG + ":id/edit_profile_button"));

              // Иконка «Профиль» в нижнем меню Instagram.
              private static final Pattern PROFILE_TAB = Pattern.compile(
                      "^(профиль|profile|perfil)$",
                      Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);

              private final Handler handler = new Handler(Looper.getMainLooper());
              private SharedPreferences prefs;
              // Где плашка стояла в прошлый раз — чтобы ставить её заранее, до отрисовки экрана.
              private List<Rect> lastKnown = new ArrayList<>();
              // Был ли открыт свой профиль при последней проверке.
              private boolean wasOnOwnProfile = false;
              // До этого момента не убираем плашку, поставленную заранее, даже если цифру ещё не нашли.
              private long predictUntil = 0;
              private final List<View> overlays = new ArrayList<>();
              private List<Rect> current = new ArrayList<>();
              private WindowManager wm;
              private boolean scanPending = false;

              private final Runnable scan = this::scanNow;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  prefs = getSharedPreferences("hide", MODE_PRIVATE);
                  lastKnown = decode(prefs.getString("rects", ""));
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  CharSequence pkg = event.getPackageName();
                  boolean inIg = pkg != null && IG.contentEquals(pkg);
                  int type = event.getEventType();

                  // Опережаем Instagram: нажала на «Профиль» или вернулась в Instagram, где был открыт профиль —
                  // сразу ставим плашку на прошлое место, не дожидаясь, пока экран отрисуется.
                  if (inIg && !lastKnown.isEmpty()) {
                      boolean tapProfile = (type == AccessibilityEvent.TYPE_VIEW_CLICKED
                              || type == AccessibilityEvent.TYPE_VIEW_SELECTED) && isProfileTab(event);
                      boolean backToProfile = type == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED
                              && wasOnOwnProfile;
                      if (tapProfile || backToProfile) {
                          predictUntil = SystemClock.uptimeMillis() + 1500;
                          show(lastKnown);
                      }
                  }

                  // Проверяем сразу, без искусственной паузы; несколько событий подряд склеиваются в одну проверку.
                  if (!scanPending) {
                      scanPending = true;
                      handler.post(scan);
                  }
              }

              private boolean isProfileTab(AccessibilityEvent event) {
                  CharSequence d = event.getContentDescription();
                  if (d != null && PROFILE_TAB.matcher(d.toString().trim()).find()) return true;
                  for (CharSequence t : event.getText()) {
                      if (t != null && PROFILE_TAB.matcher(t.toString().trim()).find()) return true;
                  }
                  AccessibilityNodeInfo src = event.getSource();
                  if (src != null) {
                      String id = src.getViewIdResourceName();
                      if (id != null && id.endsWith(":id/profile_tab")) return true;
                      CharSequence sd = src.getContentDescription();
                      if (sd != null && PROFILE_TAB.matcher(sd.toString().trim()).find()) return true;
                  }
                  return false;
              }

              private void scanNow() {
                  scanPending = false;
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null || root.getPackageName() == null
                          || !IG.contentEquals(root.getPackageName())) {
                      // Ушла из Instagram — запоминаем, что профиль был открыт, но плашку убираем.
                      predictUntil = 0;
                      show(new ArrayList<>());
                      return;
                  }

                  List<Rect> found = new ArrayList<>();
                  boolean[] own = {false};
                  int[] budget = {3000};
                  walk(root, found, own, budget);

                  List<Rect> rects = merge(found);
                  boolean onOwn = own[0] && !rects.isEmpty();

                  if (onOwn) {
                      wasOnOwnProfile = true;
                      predictUntil = 0;
                      if (!rects.equals(lastKnown)) {
                          lastKnown = rects;
                          prefs.edit().putString("rects", encode(rects)).apply();
                      }
                      show(rects);
                  } else if (SystemClock.uptimeMillis() < predictUntil) {
                      // Плашка поставлена заранее, а экран ещё грузится — держим её и проверяем снова.
                      handler.removeCallbacks(scan);
                      handler.postDelayed(scan, 60);
                      scanPending = true;
                      return;
                  } else {
                      if (own[0] || !rects.isEmpty() || root.getChildCount() > 0) wasOnOwnProfile = false;
                      show(new ArrayList<>());
                  }

                  // Пока плашка на экране — перепроверяем, чтобы она исчезла, когда уходишь из профиля.
                  if (!overlays.isEmpty()) {
                      handler.removeCallbacks(scan);
                      handler.postDelayed(scan, 400);
                      scanPending = true;
                  }
              }

              private void walk(AccessibilityNodeInfo n, List<Rect> out, boolean[] own, int[] budget) {
                  if (n == null || budget[0]-- <= 0) return;

                  String id = n.getViewIdResourceName();
                  CharSequence t = n.getText();
                  CharSequence d = n.getContentDescription();
                  String s = (t == null ? "" : t.toString()) + " " + (d == null ? "" : d.toString());

                  if ((id != null && OWN_IDS.contains(id)) || OWN_PROFILE.matcher(s).find()) {
                      own[0] = true;
                  }

                  boolean match = (id != null && FOLLOWER_IDS.contains(id))
                          || (s.length() < 60 && FOLLOWERS.matcher(s).find());

                  if (match && n.isVisibleToUser()) {
                      Rect r = targetRect(n);
                      if (r != null) out.add(r);
                  }

                  for (int i = 0; i < n.getChildCount(); i++) {
                      walk(n.getChild(i), out, own, budget);
                  }
              }

              /** Поднимаемся к кликабельному блоку «число + подписчики», чтобы закрыть цифру вместе с подписью. */
              private Rect targetRect(AccessibilityNodeInfo node) {
                  int screenW = getResources().getDisplayMetrics().widthPixels;
                  AccessibilityNodeInfo target = node;
                  for (int i = 0; i < 2 && !target.isClickable(); i++) {
                      AccessibilityNodeInfo p = target.getParent();
                      if (p == null) break;
                      Rect pr = new Rect();
                      p.getBoundsInScreen(pr);
                      if (pr.width() > screenW * 0.5 || pr.height() > dp(90)) break;
                      target = p;
                  }
                  Rect r = new Rect();
                  target.getBoundsInScreen(r);
                  if (r.isEmpty() || r.width() > screenW * 0.6) return null;
                  return r;
              }

              /** Убираем дубли: если один прямоугольник лежит внутри другого — оставляем больший. */
              private List<Rect> merge(List<Rect> in) {
                  List<Rect> out = new ArrayList<>();
                  for (Rect a : in) {
                      boolean inside = false;
                      for (Rect b : in) {
                          if (a != b && b.contains(a) && !a.equals(b)) { inside = true; break; }
                      }
                      if (!inside && !out.contains(a)) out.add(a);
                  }
                  return out;
              }

              private void show(List<Rect> rects) {
                  if (wm == null || rects.equals(current)) return;
                  current = new ArrayList<>(rects);

                  while (overlays.size() > rects.size()) {
                      View v = overlays.remove(overlays.size() - 1);
                      try { wm.removeView(v); } catch (Exception ignored) { }
                  }
                  while (overlays.size() < rects.size()) {
                      View v = makePatch();
                      try {
                          wm.addView(v, params(rects.get(overlays.size())));
                          overlays.add(v);
                      } catch (Exception e) {
                          return;
                      }
                  }
                  for (int i = 0; i < rects.size(); i++) {
                      try { wm.updateViewLayout(overlays.get(i), params(rects.get(i))); } catch (Exception ignored) { }
                  }
              }

              private View makePatch() {
                  boolean night = (getResources().getConfiguration().uiMode
                          & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(night ? 0xFF0C1014 : 0xFFFFFFFF);
                  bg.setCornerRadius(dp(10));

                  TextView v = new TextView(this);
                  v.setBackground(bg);
                  v.setText("***");
                  v.setTextColor(night ? 0xFFF5F5F5 : 0xFF0C1014);
                  v.setGravity(Gravity.CENTER);
                  v.setTextSize(TypedValue.COMPLEX_UNIT_SP, 18);
                  v.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
                  return v;
              }

              private WindowManager.LayoutParams params(Rect r) {
                  int pad = dp(6);
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          r.width() + pad * 2,
                          r.height() + pad * 2,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  lp.x = r.left - pad;
                  lp.y = r.top - pad;
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  return lp;
              }

              private static String encode(List<Rect> rects) {
                  StringBuilder sb = new StringBuilder();
                  for (Rect r : rects) sb.append(r.flattenToString()).append(';');
                  return sb.toString();
              }

              private static List<Rect> decode(String s) {
                  List<Rect> out = new ArrayList<>();
                  if (s == null) return out;
                  for (String part : s.split(";")) {
                      Rect r = Rect.unflattenFromString(part);
                      if (r != null && !r.isEmpty()) out.add(r);
                  }
                  return out;
              }

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              private void clearAll() {
                  handler.removeCallbacks(scan);
                  scanPending = false;
                  current = new ArrayList<>();
                  if (wm == null) return;
                  for (View v : overlays) {
                      try { wm.removeView(v); } catch (Exception ignored) { }
                  }
                  overlays.clear();
              }

              @Override
              public void onInterrupt() {
                  clearAll();
              }

              @Override
              public void onDestroy() {
                  clearAll();
                  super.onDestroy();
              }
          }
          EOF_HF
          mkdir -p "$(dirname 'app/src/main/java/com/anna/hidefollowers/MainActivity.java')"
          cat > 'app/src/main/java/com/anna/hidefollowers/MainActivity.java' <<'EOF_HF'
          package com.anna.hidefollowers;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  int pad = Math.round(24 * getResources().getDisplayMetrics().density);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER_HORIZONTAL);
                  box.setPadding(pad, pad * 2, pad, pad);

                  TextView title = new TextView(this);
                  title.setText("🙈 Скрыть подписчиков");
                  title.setTextSize(24);
                  title.setGravity(Gravity.CENTER);

                  TextView info = new TextView(this);
                  info.setText("\nЗакрывает число подписчиков на твоём профиле в Instagram. "
                          + "Чужие профили, лайки и всё остальное остаются как были.\n\n"
                          + "Чтобы заработало: нажми кнопку ниже → «Скачанные приложения» → "
                          + "«Скрыть подписчиков» → включи.\n");
                  info.setTextSize(16);

                  status = new TextView(this);
                  status.setTextSize(18);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(0, 0, 0, pad);

                  Button open = new Button(this);
                  open.setText("Открыть настройки");
                  open.setOnClickListener(v ->
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));

                  box.addView(title);
                  box.addView(info);
                  box.addView(status);
                  box.addView(open);
                  setContentView(box);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  status.setText(isEnabled() ? "✅ Включено" : "⚪ Пока выключено");
              }

              private boolean isEnabled() {
                  String enabled = Settings.Secure.getString(getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  if (enabled == null) return false;
                  String me = new ComponentName(this, HideService.class).flattenToString();
                  for (String s : enabled.split(":")) {
                      if (s.equalsIgnoreCase(me)) return true;
                  }
                  return false;
              }
          }
          EOF_HF
          echo '' | base64 -d > app/hf.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk HideFollowers.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HideFollowers
          files: HideFollowers.apk
          make_latest: true
